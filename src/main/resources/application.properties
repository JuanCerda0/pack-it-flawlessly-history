spring.application.name=history
server.port=${PORT:8082}

spring.datasource.url=${HISTORY_DB_URL:jdbc:postgresql://localhost:5432/packit_history}
spring.datasource.username=${HISTORY_DB_USERNAME:postgres}
spring.datasource.password=${HISTORY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.rabbitmq.host=${HISTORY_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${HISTORY_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${HISTORY_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${HISTORY_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.auto-startup=${HISTORY_CONSUMER_ENABLED:true}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vidDVo9o0}
app.cors.allowed-origins=${HISTORY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
